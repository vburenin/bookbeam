services:
  bookbeam:
    build: .
    container_name: bookbeam-server
    command: ["-addr", ":8180", "-data", "/data"]
    ports:
      - "8180:8180"
    volumes:
      # Your audiobook library on the host (set BOOKBEAM_DATA in .env.bookbeam).
      # BookBeam stores its state in <library>/.bookbeam. To keep the library
      # read-only, add a second volume and point BOOKBEAM_STATE at it, e.g.
      #   - ./bookbeam-state:/config
      # and set BOOKBEAM_STATE=/config in .env.bookbeam.
      - type: bind
        source: ${BOOKBEAM_DATA}
        target: /data
    env_file:
      - .env.bookbeam
    environment:
      BOOKBEAM_USERS: ${BOOKBEAM_USERS}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8180/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # BookBeam saves sessions first on SIGTERM and exits within ~8 s even
    # with audio streaming; the extra margin covers slow NAS disks.
    stop_grace_period: 15s
