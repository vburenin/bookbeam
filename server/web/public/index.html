<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d1422">
  <meta name="description" content="BookBeam: your family's audiobooks, right where you left off.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BookBeam">
  <title>BookBeam</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/atkinson-next.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fraunces-opsz.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/app.css">
  <!-- Classic script first: shows a retry screen if a module fails to load. -->
  <script src="assets/boot-guard.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <div id="app">
    <div class="splash" id="boot-splash" aria-label="Loading BookBeam">
      <svg class="splash-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 5.5c2.6-.9 5.1-.5 7.5 1.2v13c-2.4-1.7-4.9-2.1-7.5-1.2z"/><path d="M19.5 5.5c-2.6-.9-5.1-.5-7.5 1.2v13c2.4-1.7 4.9-2.1 7.5-1.2z"/></svg>
    </div>
  </div>
  <noscript><p class="noscript">BookBeam needs JavaScript to play audiobooks. Please enable it and reload.</p></noscript>
</body>
</html>
